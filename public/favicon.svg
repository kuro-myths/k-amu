<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </linearGradient>
    <filter id="softShadow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Left side - White background -->
  <rect x="0" y="0" width="100" height="200" fill="#ffffff" rx="40"/>
  
  <!-- Right side - Black background -->
  <rect x="100" y="0" width="100" height="200" fill="#1a1a1a" rx="40"/>
  
  <!-- Subtle border -->
  <rect width="200" height="200" fill="none" stroke="#e0e0e0" stroke-width="1" rx="40" opacity="0.6"/>
  
  <!-- Left side - Black K (flipped) on white background -->
  <g transform="translate(50, 100) scale(-1, 1) translate(-50, -100)">
    <text x="50" y="120" font-family="Arial, sans-serif" font-size="100" font-weight="900" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">K</text>
  </g>
  
  <!-- Right side - White K on black background -->
  <text x="150" y="120" font-family="Arial, sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">K</text>
  
  <!-- Elegant center divider with accent -->
  <line x1="100" y1="40" x2="100" y2="160" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="40" x2="100" y2="160" stroke="#000000" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Decorative corner accents -->
  <circle cx="175" cy="25" r="2.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="25" cy="175" r="2.5" fill="#000000" opacity="0.5"/>
</svg>